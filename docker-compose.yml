services:

  docker-challenge:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: docker-challenge

    ports:
      - "8080:80"

    depends_on:
      scraper:
        condition: service_healthy

    networks:
      - challenge

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile

    container_name: metrics-scraper

    expose:
      - "9100"

    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - challenge

networks:
  challenge:
    driver: bridge
