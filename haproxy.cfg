global
     log /dev/log local0
     log /dev/log local1 notice

     chroot /var/lib/haproxy
     user haproxy
     group haproxy

     daemon
     pidfile /usr/local/etc/haproxy/haproxy.pid

defaults
     mode http

     timeout http-request 2000
     timeout queue 1000
     timeout connect 2000
     timeout client 5000
     timeout server 5000
     timeout check 2000

     log global

     option dontlognull
     option clitcpka
     option srvtcpka
     option tcpka

frontend http-in
     mode http

     option forwardfor

     bind *:80

     acl is_metrics path_beg /metrics
     use_backend metrics if is_metrics

     default_backend webservers

backend webservers
     mode http

     balance roundrobin

     server nginx01 127.0.0.1:8000 check
     server nginx02 127.0.0.1:8001 check
     server nginx03 127.0.0.1:8002 check

backend metrics
     mode http

     server metrics-scraper scraper:9100 check
